<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LucasTech GYM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0B1120; color: white; }
        .bg-card { background-color: #1E293B; }
        .text-accent { color: #3B82F6; }
        .bg-accent { background-color: #3B82F6; }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center">

    <main class="max-w-md w-full flex flex-col gap-6">
        <!-- Header -->
        <header class="flex justify-between items-center py-2">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold">LT</div>
                <h1 class="font-bold text-xl tracking-wide">LucasTech <span class="text-blue-500">GYM</span></h1>
            </div>
            <i class="fa-solid fa-gear text-slate-500"></i>
        </header>

        <!-- Sección Principal -->
        <section>
            <h2 class="text-2xl font-bold mb-4">¿Qué toca hoy?</h2>
            
            <!-- Selector de Días -->
            <div id="day-selector" class="flex gap-3 overflow-x-auto scroll-hide pb-2">
                <!-- Se genera con JS -->
            </div>
        </section>

        <!-- Progreso -->
        <section class="bg-card p-5 rounded-3xl border border-slate-700/50">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <h3 class="font-bold text-lg" id="day-title">Día 01</h3>
                    <p class="text-slate-400 text-sm">Tu entrenamiento</p>
                </div>
                <div class="text-right">
                    <span id="progress-text" class="text-2xl font-black">0/0</span>
                    <span class="text-slate-500 text-xs block">HECHOS</span>
                </div>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-2 mt-2">
                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </section>

        <!-- Lista de Ejercicios -->
        <div id="exercise-list" class="flex flex-col gap-3">
            <!-- Se generan con JS -->
        </div>
    </main>

    <script>
        const workoutData = [
            { id: 1, name: "Día 01", category: "Pectoral - Hombros - Bíceps", exercises: [
                { id: 1, name: "Peck Deck", muscle: "PECTORAL", sets: "3 series x 15 reps" },
                { id: 2, name: "Press en banco plano", muscle: "PECTORAL", sets: "4 series x 10 reps" }
            ]},
            { id: 2, name: "Día 02", category: "Espalda - Tríceps", exercises: [
                { id: 3, name: "Jalón al pecho", muscle: "ESPALDA", sets: "4 series x 12 reps" }
            ]}
        ];

        let selectedDay = 0;
        let completedExercises = JSON.parse(localStorage.getItem('completed') || "{}");

        function render() {
            const selector = document.getElementById('day-selector');
            selector.innerHTML = '';
            
            workoutData.forEach((day, index) => {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 w-20 h-20 rounded-2xl flex flex-col items-center justify-center border ${selectedDay === index ? 'bg-blue-600 border-blue-500' : 'bg-card border-slate-700'}`;
                btn.innerHTML = `<span class="text-xs text-slate-300">${day.name}</span><span class="font-bold">${day.exercises.length}</span><span class="text-[10px] opacity-70">ejercicios</span>`;
                btn.onclick = () => { selectedDay = index; render(); };
                selector.appendChild(btn);
            });

            const day = workoutData[selectedDay];
            document.getElementById('day-title').innerText = day.name;
            
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            
            let count = 0;
            day.exercises.forEach(ex => {
                const isChecked = completedExercises[`${selectedDay}-${ex.id}`];
                if(isChecked) count++;
                
                const card = document.createElement('div');
                card.className = `bg-card p-4 rounded-2xl border border-slate-700/50 flex items-center gap-4 ${isChecked ? 'opacity-60' : ''}`;
                card.innerHTML = `
                    <button onclick="toggle(${ex.id})" class="w-6 h-6 rounded-full border-2 border-blue-500 flex items-center justify-center">
                        ${isChecked ? '<i class="fa-solid fa-check text-blue-500 text-xs"></i>' : ''}
                    </button>
                    <div>
                        <p class="text-[10px] text-blue-400 font-bold tracking-widest">${ex.muscle}</p>
                        <p class="font-bold">${ex.name}</p>
                        <p class="text-sm text-slate-400">${ex.sets}</p>
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('progress-text').innerText = `${count}/${day.exercises.length}`;
            document.getElementById('progress-bar').style.width = (count/day.exercises.length)*100 + "%";
        }

        window.toggle = (id) => {
            const key = `${selectedDay}-${id}`;
            completedExercises[key] = !completedExercises[key];
            localStorage.setItem('completed', JSON.stringify(completedExercises));
            render();
        }

        render();
    </script>
</body>
</html>
